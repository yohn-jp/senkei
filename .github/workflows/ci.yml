name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native Rust build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  conformance:
    name: Native and real WebAssembly conformance
    runs-on: ubuntu-latest
    env:
      SENKEI_NATIVE_DISPATCHER: target/debug/senkei-wasm-dispatch
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install --yes lld
      - run: npm ci
      - run: cargo build --locked --bin senkei-wasm-dispatch
      - run: bash scripts/wasm/build.sh
      - run: node tests/conformance/generate-scenario-inputs.mjs --check
      - run: node tests/conformance/compare-adapters.mjs
      - run: bash scripts/balance/run-next.sh

  web:
    name: Web application build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  browser:
    name: Production browser smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install --yes lld
      - run: npm ci
      - run: npm ci --prefix tests/browser
      - run: bash scripts/wasm/build.sh
      - run: npm run build
      - run: npx --prefix tests/browser playwright install --with-deps chromium
      - run: npm run test:e2e --prefix tests/browser
