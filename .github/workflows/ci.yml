name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native Rust build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Full canonical battles exercise hundreds of ticks, including mirrored
      # base assaults; use the same optimized core as the WASM/browser build.
      - run: cargo build --workspace --release --locked
      # A failed Enbu target must not prevent the independent Jinrei and ABI tests.
      - run: cargo test --workspace --release --locked --no-fail-fast

  enbu-native-features:
    name: Enbu Native regression / ${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [core, arithmetic, world, hybrid]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Real Jinrei Enbu optimized behavioral regression
        if: matrix.group == 'core'
        run: |
          cargo test --locked --release -p enbu --features lab-optimizations --test next_scenarios canonical_battlefield_real_jinrei_match_covers_tracks_fords_bridges_and_node_combat -- --exact
          cargo test --locked --release -p enbu --features lab-optimizations --test next_scenarios trial_targeting_is_individual_and_drives_normal_attacks -- --exact
      - name: Verify indexed route and batched visibility against real Jinrei gameplay
        if: matrix.group == 'core'
        run: |
          cargo test --locked --release -p enbu --features lab-opt-route,lab-opt-visibility --test next_scenarios canonical_battlefield_real_jinrei_match_covers_tracks_fords_bridges_and_node_combat -- --exact
          cargo test --locked --release -p enbu --features lab-opt-route,lab-opt-visibility --test next_scenarios trial_targeting_is_individual_and_drives_normal_attacks -- --exact
      - name: Verify Planned candidate kernel against real Jinrei gameplay
        if: matrix.group == 'arithmetic'
        run: |
          cargo test --locked --release -p enbu --features lab-opt-planned planned_candidates_are_reference_equivalent_for_combat_and_actor_traces -- --nocapture
          cargo test --locked --release -p enbu --features lab-opt-planned --test next_scenarios canonical_battlefield_real_jinrei_match_covers_tracks_fords_bridges_and_node_combat -- --exact
          cargo test --locked --release -p enbu --features lab-opt-planned --test next_scenarios trial_targeting_is_individual_and_drives_normal_attacks -- --exact
      - name: Verify graph-local attack partition against real Next and owner traces
        if: matrix.group == 'world'
        run: |
          cargo test --locked --release -p enbu --features lab-opt-spatial --lib next_combat::tests::spatial_graph_partition_matches_reference_hits_and_owner_candidate_traces -- --exact
          cargo test --locked --release -p enbu --features lab-opt-spatial --lib next_navigation::tests::spatial_attack_hold_matches_reference_across_owners_nodes_and_reversed_edges -- --exact
          cargo test --locked --release -p enbu --features lab-opt-spatial --test next_scenarios canonical_battlefield_real_jinrei_match_covers_tracks_fords_bridges_and_node_combat -- --exact
          cargo test --locked --release -p enbu --features lab-opt-spatial --test next_scenarios trial_targeting_is_individual_and_drives_normal_attacks -- --exact
      - name: Arithmetic dispatcher differential and real Jinrei gameplay
        if: matrix.group == 'arithmetic'
        run: |
          cargo test --locked --release -p enbu --features lab-opt-arithmetic --lib
          cargo test --locked --release -p enbu --features lab-opt-arithmetic --test next_scenarios canonical_battlefield_real_jinrei_match_covers_tracks_fords_bridges_and_node_combat -- --exact
          cargo test --locked --release -p enbu --features lab-opt-arithmetic --test next_scenarios trial_targeting_is_individual_and_drives_normal_attacks -- --exact
          cargo test --locked --release -p enbu --features lab-opt-arithmetic,lab-opt-planned --lib
      - name: Verify frozen snapshot reuse and combined Hybrid selectors
        if: matrix.group == 'arithmetic'
        run: |
          cargo test --locked --release -p enbu --features lab-opt-frozen --lib
          cargo test --locked --release -p enbu --features lab-opt-frozen --test next_scenarios canonical_battlefield_real_jinrei_match_covers_tracks_fords_bridges_and_node_combat -- --exact
          cargo test --locked --release -p enbu --features lab-opt-frozen,lab-opt-arithmetic,lab-opt-planned --lib
      - name: Verify exact fog-probe cache and state-dependent invalidation
        if: matrix.group == 'world'
        run: |
          cargo test --locked --release -p enbu --features lab-opt-fog-cache --lib
          cargo test --locked --release -p enbu --features lab-opt-fog-cache --test next_scenarios canonical_battlefield_real_jinrei_match_covers_tracks_fords_bridges_and_node_combat -- --exact
          cargo test --locked --release -p enbu --features lab-optimizations,lab-opt-route,lab-opt-visibility,lab-opt-fog-cache --lib
      - name: Verify indexed current-Tick observations and dynamic visibility
        if: matrix.group == 'world'
        run: |
          cargo test --locked --release -p enbu --features lab-opt-observation --lib
          cargo test --locked --release -p enbu --features lab-opt-observation --test next_scenarios canonical_battlefield_real_jinrei_match_covers_tracks_fords_bridges_and_node_combat -- --exact
          cargo test --locked --release -p enbu --features lab-optimizations,lab-opt-route,lab-opt-visibility,lab-opt-fog-cache,lab-opt-observation --lib
      - name: Verify in-place movement and combat visibility frontier
        if: matrix.group == 'world'
        run: |
          cargo test --locked --release -p enbu --features lab-opt-frontier --lib
          cargo test --locked --release -p enbu --features lab-opt-inplace --lib
          cargo test --locked --release -p enbu --features lab-opt-inplace,lab-opt-frontier --test next_scenarios canonical_battlefield_real_jinrei_match_covers_tracks_fords_bridges_and_node_combat -- --exact
          cargo test --locked --release -p enbu --features lab-optimizations,lab-opt-route,lab-opt-visibility,lab-opt-inplace,lab-opt-frontier --lib
      - name: Verify hybrid phase portfolio with independent Jinrei/canonical Replay
        if: matrix.group == 'hybrid'
        run: |
          cargo test --locked --release -p enbu --features lab-opt-replay-fusion --lib
          cargo test --locked --release -p enbu --features lab-opt-replay-fusion --test next_scenarios canonical_battlefield_real_jinrei_match_covers_tracks_fords_bridges_and_node_combat -- --exact
          cargo test --locked --release -p enbu --features lab-opt-hybrid --lib
          cargo test --locked --release -p enbu --features lab-opt-hybrid --test next_scenarios canonical_battlefield_real_jinrei_match_covers_tracks_fords_bridges_and_node_combat -- --exact
          cargo test --locked --release -p enbu --features lab-optimizations,lab-opt-route,lab-opt-visibility,lab-opt-hybrid --lib
      - name: Verify exact temporal domain frontiers and canonical Tick obligations
        if: matrix.group == 'hybrid'
        run: |
          cargo test --locked --release -p enbu --features lab-opt-scheduler --lib
          cargo test --locked --release -p enbu --features lab-opt-scheduler --test next_scenarios canonical_battlefield_real_jinrei_match_covers_tracks_fords_bridges_and_node_combat -- --exact
          cargo test --locked --release -p enbu --features lab-opt-scheduler,lab-opt-hybrid --lib
          cargo test --locked --release -p enbu --features lab-opt-scheduler,lab-opt-hybrid --test next_scenarios trial_targeting_is_individual_and_drives_normal_attacks -- --exact

  conformance:
    name: Native and real WebAssembly conformance
    needs: browser-build
    runs-on: ubuntu-latest
    env:
      SENKEI_NATIVE_DISPATCHER: target/release/senkei-wasm-dispatch
      NEXT_STRATEGIC_REPORT: target/next-balance/strategic-measurements.json
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Use the exact tested production browser WASM and native dispatcher.
      # Rebuilding here produced redundant WASM work and ambiguous provenance.
      - uses: actions/download-artifact@v4
        with:
          name: integration-runtime-diagnostics
          path: .
      - name: Verify exact same-revision native/WASM inputs
        run: |
          test "$(cat target/integration-runtime/source-revision.txt)" = "$(git rev-parse HEAD)"
          sha256sum --check target/integration-runtime/sha256.txt
          test -s apps/web/public/wasm/senkei_wasm.wasm
          chmod +x target/release/senkei-wasm-dispatch
      - name: Contract — generated scenario inputs are current
        run: node tests/conformance/generate-scenario-inputs.mjs --check
      - name: Determinism — native and real WebAssembly adapters
        run: node tests/conformance/compare-adapters.mjs
      - name: Behavior — native and real WebAssembly identity and owner parity
        run: node tests/conformance/behavior-dispatch-parity.mjs
      - name: Gameplay — fixed Next scenario matrix and adapter parity
        run: |
          mkdir -p target/next-balance
          rm -f "$NEXT_STRATEGIC_REPORT"
          git rev-parse HEAD > target/next-balance/source-revision.txt
          bash scripts/balance/run-next.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameplay-evidence-next-scenarios
          compression-level: 0
          path: |
            target/next-balance/latest.json
            target/next-balance/strategic-measurements.json
            target/next-balance/source-revision.txt
            target/next-balance/adapter/
          if-no-files-found: ignore

  web:
    name: Web application build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Parse Playwright specs before CI shards
        run: node scripts/ci/validate-browser-spec-syntax.mjs
      - name: Check generated replay contract types
        run: npm run contract:types && git diff --exit-code -- packages/replay-contract/src/generated.ts
      - run: npm test
      - run: node --test scripts/ci/validate-browser-spec-syntax.test.mjs scripts/ci/verify-browser-captures.test.mjs scripts/ci/verify-first-run-coverage.test.mjs
      - run: npm run build

  browser-build:
    name: Production browser build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install --yes lld
      - run: npm ci
      - name: Parse Playwright specs before Campaign fixture generation
        run: node scripts/ci/validate-browser-spec-syntax.mjs
      - run: bash scripts/wasm/build.sh
      - run: npm run build
      - name: Build the native dispatcher for Campaign browser fixtures
        run: cargo build --locked --release -p senkei-wasm --bin senkei-wasm-dispatch
      - name: Preserve exact runtime for integration failure reproduction
        run: |
          mkdir -p target/integration-runtime
          git rev-parse HEAD > target/integration-runtime/source-revision.txt
          git archive --format=tar.gz --output=target/integration-runtime/source.tar.gz HEAD apps crates packages scenarios scripts tests Cargo.toml Cargo.lock package.json package-lock.json vite.config.ts vitest.config.ts playwright.config.ts tsconfig.json tsconfig.app.json tsconfig.node.json tsconfig.graphics.json
          cmp apps/web/public/wasm/senkei_wasm.wasm dist/web/wasm/senkei_wasm.wasm
          sha256sum target/release/senkei-wasm-dispatch apps/web/public/wasm/senkei_wasm.wasm dist/web/wasm/senkei_wasm.wasm dist/web/index.html target/integration-runtime/source.tar.gz > target/integration-runtime/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          # Diagnostic artifacts are not an accepted production-browser-build.
          name: integration-runtime-diagnostics
          retention-days: 3
          path: |
            target/integration-runtime/
            target/release/senkei-wasm-dispatch
            apps/web/public/wasm/
            dist/web/
      # Cargo cache can restore target/browser-scenarios/campaign-native from an older run.
      # Remove only that generated cache before the strict immutable producer runs.
      - name: Remove cached Campaign fixture output
        run: rm -rf target/browser-scenarios/campaign-native
      - name: Generate immutable native browser scenarios once
        run: bash scripts/ci/prepare-browser-scenarios.sh target/browser-scenarios
      - name: Generate immutable native Campaign fixtures once
        run: node scripts/ci/browser/prepare-native-campaign-fixtures.mjs prepare target/browser-scenarios/campaign-native
        env:
          SENKEI_NATIVE_DISPATCHER: ${{ github.workspace }}/target/release/senkei-wasm-dispatch
      - name: Record the exact browser build
        run: |
          git rev-parse HEAD > dist/browser-build-revision.txt
          cmp apps/web/public/wasm/senkei_wasm.wasm dist/web/wasm/senkei_wasm.wasm
          sha256sum apps/web/public/wasm/senkei_wasm.wasm dist/web/wasm/senkei_wasm.wasm dist/web/index.html > dist/browser-build-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: production-browser-build
          compression-level: 0
          path: |
            dist/
            apps/web/public/wasm/
            target/browser-scenarios/

  browser-shard:
    name: Browser / ${{ matrix.name }}
    needs: browser-build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # Keep all evidence when one group fails. Each runner has one GPU worker.
      fail-fast: false
      matrix:
        include:
          - name: journeys-analysis
            suite: journeys
            grep: S13 uses real Enbu
          - name: journeys-workbench
            suite: journeys
            grep: real WASM Next workbench
          - name: journeys-campaign
            suite: journeys-campaign
          - name: journeys-retention
            suite: journeys-retention
          - name: journeys-rematch
            suite: journeys-rematch
          - name: journeys-skill
            suite: journeys-skill
          - name: journeys-import
            suite: journeys-import
          - name: journeys-ui
            suite: journeys-ui
            grep_invert: S13 uses real Enbu|first-run Quick|real WASM Next workbench
            graphics_g1: true
          - name: quick-mobile-320
            suite: journeys
            grep: first-run Quick
            first_run_viewports: mobile-320
          - name: quick-mobile-390
            suite: journeys
            grep: first-run Quick
            first_run_viewports: mobile-390
          - name: quick-mobile-430
            suite: journeys
            grep: first-run Quick
            first_run_viewports: mobile-430
          - name: quick-desktop-1440
            suite: journeys
            grep: first-run Quick
            first_run_viewports: desktop-1440
          - name: quick-desktop-1920
            suite: journeys
            grep: first-run Quick
            first_run_viewports: desktop-1920
          - name: verification-desktop
            suite: verification
            verification_viewports: 1920x1080,1440x900
          - name: verification-mobile
            suite: verification
            verification_viewports: 430x932,390x844,320x844
          - name: visual-desktop-1440
            suite: visual
            visual_viewports: 1440x900
          - name: visual-desktop-1920
            suite: visual
            visual_viewports: 1920x1080
          - name: visual-mobile-375
            suite: visual
            visual_viewports: 375x812
          - name: visual-mobile-390
            suite: visual
            visual_viewports: 390x844
          - name: visual-mobile-430
            suite: visual
            visual_viewports: 430x932
          - name: visual-mobile-320
            suite: visual
            visual_viewports: 320x740
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix tests/browser
      - uses: actions/download-artifact@v4
        with:
          name: production-browser-build
          path: .
      - name: Verify browser build provenance
        run: |
          test "$(cat dist/browser-build-revision.txt)" = "$(git rev-parse HEAD)"
          sha256sum --check dist/browser-build-sha256.txt
      - name: Verify immutable Campaign fixture provenance
        run: node scripts/ci/browser/prepare-native-campaign-fixtures.mjs verify target/browser-scenarios/campaign-native "$(git rev-parse HEAD)"
      - run: npx --prefix tests/browser playwright install --with-deps chromium
      - name: Install root Graphics G1 Playwright browser
        if: matrix.graphics_g1 == true
        run: npx playwright install --with-deps chromium
      - name: Run browser group
        run: |
          if [ -z "$SENKEI_FIRST_RUN_VIEWPORTS" ]; then unset SENKEI_FIRST_RUN_VIEWPORTS; fi
          npm run test:e2e --prefix tests/browser -- --workers=1 --retries=0
        env:
          SENKEI_BROWSER_SUITE: ${{ matrix.suite }}
          SENKEI_BROWSER_GREP: ${{ matrix.grep }}
          SENKEI_BROWSER_GREP_INVERT: ${{ matrix.grep_invert }}
          SENKEI_FIRST_RUN_VIEWPORTS: ${{ matrix.first_run_viewports }}
          SENKEI_UX_EVIDENCE_DIR: ${{ github.workspace }}/test-results/ci-browser/journey
          BATTLEFIELD_PREBUILT_SCENARIO_DIR: ${{ github.workspace }}/target/browser-scenarios
          SENKEI_CAMPAIGN_NATIVE_FIXTURE_DIR: ${{ github.workspace }}/target/browser-scenarios/campaign-native
          BATTLEFIELD_VIEWPORTS: ${{ matrix.verification_viewports }}
          BATTLEFIELD_VISUAL_VIEWPORTS: ${{ matrix.visual_viewports }}
          BATTLEFIELD_EXPECT_BUILD_REVISION: "true"
          BATTLEFIELD_EXPECT_BATTLEFIELD_CONSOLE: "true"
          BATTLEFIELD_EXPECT_BASE_SITES: "true"
          BATTLEFIELD_OUTPUT_DIR: ${{ github.workspace }}/test-results/ci-browser/verification
          BATTLEFIELD_VISUAL_OUTPUT_DIR: ${{ github.workspace }}/test-results/ci-browser/visual
      - name: Run Graphics G1 replay browser suite
        if: matrix.graphics_g1 == true
        run: npm run test:browser -- --workers=1
        env:
          SENKEI_GRAPHICS_EVIDENCE_DIR: ${{ github.workspace }}/test-results/ci-browser/graphics-g1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-${{ matrix.name }}
          compression-level: 0
          path: |
            test-results/ci-browser/
            tests/browser/test-results/
            test-results/ux-session-1/
      - uses: actions/upload-artifact@v4
        if: always() && matrix.suite == 'visual'
        with:
          name: browser-capture-metadata-${{ matrix.name }}
          path: test-results/ci-browser/visual/**/metadata.json
      - uses: actions/upload-artifact@v4
        if: always() && matrix.first_run_viewports != ''
        with:
          name: browser-first-run-coverage-${{ matrix.name }}
          path: test-results/ci-browser/journey/first-run-report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && matrix.graphics_g1 == true
        with:
          name: browser-journey-legacy-evidence
          compression-level: 0
          path: |
            docs/evidence/next/atelier/
            docs/evidence/battlefield/canonical-browser/

  browser:
    # Preserve the existing required check name for branch protection.
    name: Production browser smoke
    needs: [browser-build, browser-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the build and every browser group
        env:
          BROWSER_BUILD_RESULT: ${{ needs.browser-build.result }}
          BROWSER_SHARDS_RESULT: ${{ needs.browser-shard.result }}
        run: |
          test "$BROWSER_BUILD_RESULT" = success
          test "$BROWSER_SHARDS_RESULT" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: browser-capture-metadata-*
          path: visual-capture-metadata
      - name: Verify combined viewport coverage and replay identities
        env:
          CAPTURE_SOURCE_REVISION: ${{ github.sha }}
        run: node scripts/ci/verify-browser-captures.mjs visual-capture-metadata "$CAPTURE_SOURCE_REVISION"
      - uses: actions/download-artifact@v4
        with:
          pattern: browser-first-run-coverage-*
          path: first-run-coverage
      - name: Verify every first-run viewport executed a real confirmed match
        run: node scripts/ci/verify-first-run-coverage.mjs first-run-coverage "${{ github.sha }}"
