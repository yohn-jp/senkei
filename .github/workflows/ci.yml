name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native Rust build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Full canonical battles exercise hundreds of ticks, including mirrored
      # base assaults; use the same optimized core as the WASM/browser build.
      - run: cargo build --workspace --release --locked
      - run: cargo test --workspace --release --locked

  conformance:
    name: Native and real WebAssembly conformance
    runs-on: ubuntu-latest
    env:
      SENKEI_NATIVE_DISPATCHER: target/release/senkei-wasm-dispatch
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install --yes lld
      - run: npm ci
      - run: cargo build --locked --release --bin senkei-wasm-dispatch
      - run: bash scripts/wasm/build.sh
      - run: node tests/conformance/generate-scenario-inputs.mjs --check
      - run: node tests/conformance/compare-adapters.mjs
      - run: bash scripts/balance/run-next.sh

  web:
    name: Web application build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  browser:
    name: Production browser smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install --yes lld
      - run: npm ci
      - run: npm ci --prefix tests/browser
      - run: bash scripts/wasm/build.sh
      - run: npm run build
      - run: npx --prefix tests/browser playwright install --with-deps chromium
      - run: npm run test:e2e --prefix tests/browser
        env:
          BATTLEFIELD_EXPECT_BUILD_REVISION: "true"
          BATTLEFIELD_EXPECT_BATTLEFIELD_CONSOLE: "true"
          BATTLEFIELD_EXPECT_BASE_SITES: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-local-browser-evidence
          path: |
            docs/evidence/next/
            docs/evidence/battlefield/
            tests/browser/test-results/
            test-results/ux-session-1/
