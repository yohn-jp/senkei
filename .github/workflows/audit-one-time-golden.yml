name: One-time audit golden conformance regeneration
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  regenerate-goldens:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/main-audit-followup-55-63'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install --yes lld
      - run: npm ci
      - run: cargo build --locked --release -p senkei-wasm --bin senkei-wasm-dispatch
      - run: bash scripts/wasm/build.sh
      - name: Verify native-WASM parity and update golden responses
        run: SENKEI_NATIVE_DISPATCHER=target/release/senkei-wasm-dispatch node tests/conformance/compare-adapters.mjs --update-goldens
      - name: Commit only regenerated golden fixtures
        run: |
          set -euo pipefail
          git add scenarios/campaign/conformance/*.golden.json
          git diff --cached --stat
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "test(conformance): regenerate initial golden responses with native-WASM parity (#59)"
          git push origin HEAD:refs/heads/fix/main-audit-followup-55-63
