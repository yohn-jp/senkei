name: Deploy Senkei preview (Workers Static Assets)

on:
  workflow_dispatch:
  push:
    branches:
      - fix/main-audit-followup-55-63
    paths:
      - ".github/workflows/deploy-preview.yml"
      - "apps/**"
      - "crates/**"
      - "packages/**"
      - "scripts/wasm/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "wrangler.preview.jsonc"

permissions:
  contents: read

concurrency:
  group: senkei-preview-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: senkei-preview
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y lld
      - run: npm ci
      - run: bash scripts/wasm/build.sh
      - run: npm run build
      - name: Verify WASM is included
        run: |
          test -s dist/web/index.html
          test -s dist/web/wasm/senkei_wasm.wasm
          cmp apps/web/public/wasm/senkei_wasm.wasm dist/web/wasm/senkei_wasm.wasm
      - name: Deploy static assets
        run: npx --yes wrangler@4 deploy --config wrangler.preview.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: cbde0d943a9f28b00cd34bb12ebd142d
