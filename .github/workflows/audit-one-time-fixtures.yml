name: One-time audit fixture regeneration
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/main-audit-followup-55-63'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cargo build --locked --release -p senkei-wasm --bin senkei-wasm-dispatch
      - name: Regenerate checked-in scenario input snapshots from source rules
        run: SENKEI_NATIVE_DISPATCHER=target/release/senkei-wasm-dispatch node tests/conformance/generate-scenario-inputs.mjs --write-requests
      - name: Commit only generated conformance inputs
        run: |
          set -euo pipefail
          git add scenarios/campaign/conformance/
          git diff --cached --stat
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "test(conformance): regenerate initial rules fixtures after deploy arbitration update (#59)"
          git push origin HEAD:refs/heads/fix/main-audit-followup-55-63
