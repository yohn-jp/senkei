name: Simulation Lab Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/simulation-lab/**'
      - 'crates/enbu/**'
      - 'crates/wasm/**'
      - 'crates/jinrei/**'
      - 'crates/senritsu/**'
      - 'crates/senkei-model/**'
      - 'crates/senkei-world/**'
      - 'crates/senkei-behavior/**'
      - 'crates/senkei-editor-adapter/**'
      - 'scripts/wasm/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/simulation-lab-pages.yml'
  pull_request:
    paths:
      - 'apps/simulation-lab/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/simulation-lab-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: simulation-lab-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate synthetic and real Enbu WASM benchmarks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install WebAssembly linker
        run: sudo apt-get update && sudo apt-get install --yes lld
      - name: Validate browser-safe simulation algorithms
        run: node --test apps/simulation-lab/*.test.mjs
      - name: Export exact real Enbu Native golden fixtures
        env:
          SENKEI_LAB_FIXTURE_OUT: ${{ github.workspace }}/target/simulation-lab/enbu-fixtures.json
        run: |
          mkdir -p target/simulation-lab
          cargo test --locked --release -p senkei-wasm --test preflight_dispatch export_enbu_lab_fixtures -- --exact
          test -s target/simulation-lab/enbu-fixtures.json
      - name: Real Jinrei Enbu optimized behavioral regression
        run: |
          cargo test --locked --release -p enbu --features lab-optimizations --test next_scenarios canonical_battlefield_real_jinrei_match_covers_tracks_fords_bridges_and_node_combat -- --exact
          cargo test --locked --release -p enbu --features lab-optimizations --test next_scenarios trial_targeting_is_individual_and_drives_normal_attacks -- --exact
      - name: Verify indexed route and batched visibility against real Jinrei gameplay
        run: |
          cargo test --locked --release -p enbu --features lab-opt-route,lab-opt-visibility --test next_scenarios canonical_battlefield_real_jinrei_match_covers_tracks_fords_bridges_and_node_combat -- --exact
          cargo test --locked --release -p enbu --features lab-opt-route,lab-opt-visibility --test next_scenarios trial_targeting_is_individual_and_drives_normal_attacks -- --exact
      - name: Verify Planned candidate kernel against real Jinrei gameplay
        run: |
          cargo test --locked --release -p enbu --features lab-opt-planned planned_candidates_are_reference_equivalent_for_combat_and_actor_traces -- --nocapture
          cargo test --locked --release -p enbu --features lab-opt-planned --test next_scenarios canonical_battlefield_real_jinrei_match_covers_tracks_fords_bridges_and_node_combat -- --exact
          cargo test --locked --release -p enbu --features lab-opt-planned --test next_scenarios trial_targeting_is_individual_and_drives_normal_attacks -- --exact
      - name: Verify graph-local attack partition against real Next and owner traces
        run: |
          cargo test --locked --release -p enbu --features lab-opt-spatial --lib next_combat::tests::spatial_graph_partition_matches_reference_hits_and_owner_candidate_traces -- --exact
          cargo test --locked --release -p enbu --features lab-opt-spatial --lib next_navigation::tests::spatial_attack_hold_matches_reference_across_owners_nodes_and_reversed_edges -- --exact
          cargo test --locked --release -p enbu --features lab-opt-spatial --test next_scenarios canonical_battlefield_real_jinrei_match_covers_tracks_fords_bridges_and_node_combat -- --exact
          cargo test --locked --release -p enbu --features lab-opt-spatial --test next_scenarios trial_targeting_is_individual_and_drives_normal_attacks -- --exact
      - name: Arithmetic dispatcher differential and real Jinrei gameplay
        run: |
          cargo test --locked --release -p enbu --features lab-opt-arithmetic --lib
          cargo test --locked --release -p enbu --features lab-opt-arithmetic --test next_scenarios canonical_battlefield_real_jinrei_match_covers_tracks_fords_bridges_and_node_combat -- --exact
          cargo test --locked --release -p enbu --features lab-opt-arithmetic --test next_scenarios trial_targeting_is_individual_and_drives_normal_attacks -- --exact
          cargo test --locked --release -p enbu --features lab-opt-arithmetic,lab-opt-planned --lib
      - name: Verify frozen snapshot reuse and combined Hybrid selectors
        run: |
          cargo test --locked --release -p enbu --features lab-opt-frozen --lib
          cargo test --locked --release -p enbu --features lab-opt-frozen --test next_scenarios canonical_battlefield_real_jinrei_match_covers_tracks_fords_bridges_and_node_combat -- --exact
          cargo test --locked --release -p enbu --features lab-opt-frozen,lab-opt-arithmetic,lab-opt-planned --lib
      - name: Verify exact fog-probe cache and state-dependent invalidation
        run: |
          cargo test --locked --release -p enbu --features lab-opt-fog-cache --lib
          cargo test --locked --release -p enbu --features lab-opt-fog-cache --test next_scenarios canonical_battlefield_real_jinrei_match_covers_tracks_fords_bridges_and_node_combat -- --exact
          cargo test --locked --release -p enbu --features lab-optimizations,lab-opt-route,lab-opt-visibility,lab-opt-fog-cache --lib
      - name: Verify indexed current-Tick observations and dynamic visibility
        run: |
          cargo test --locked --release -p enbu --features lab-opt-observation --lib
          cargo test --locked --release -p enbu --features lab-opt-observation --test next_scenarios canonical_battlefield_real_jinrei_match_covers_tracks_fords_bridges_and_node_combat -- --exact
          cargo test --locked --release -p enbu --features lab-optimizations,lab-opt-route,lab-opt-visibility,lab-opt-fog-cache,lab-opt-observation --lib
      - name: Validate PR 71 in-place movement and combat visibility frontier
        run: |
          cargo test --locked --release -p enbu --features lab-opt-frontier --lib
          cargo test --locked --release -p enbu --features lab-opt-inplace --lib
          cargo test --locked --release -p enbu --features lab-opt-inplace,lab-opt-frontier --test next_scenarios canonical_battlefield_real_jinrei_match_covers_tracks_fords_bridges_and_node_combat -- --exact
          cargo test --locked --release -p enbu --features lab-optimizations,lab-opt-route,lab-opt-visibility,lab-opt-inplace,lab-opt-frontier --lib
      - name: Verify hybrid phase portfolio with independent Jinrei/canonical Replay
        run: |
          cargo test --locked --release -p enbu --features lab-opt-hybrid --lib
          cargo test --locked --release -p enbu --features lab-opt-hybrid --test next_scenarios canonical_battlefield_real_jinrei_match_covers_tracks_fords_bridges_and_node_combat -- --exact
          cargo test --locked --release -p enbu --features lab-optimizations,lab-opt-route,lab-opt-visibility,lab-opt-hybrid --lib
      - name: Verify exact temporal domain frontiers and canonical Tick obligations
        run: |
          cargo test --locked --release -p enbu --features lab-opt-scheduler --lib
          cargo test --locked --release -p enbu --features lab-opt-scheduler --test next_scenarios canonical_battlefield_real_jinrei_match_covers_tracks_fords_bridges_and_node_combat -- --exact
          cargo test --locked --release -p enbu --features lab-opt-scheduler,lab-opt-hybrid --lib
          cargo test --locked --release -p enbu --features lab-opt-scheduler,lab-opt-hybrid --test next_scenarios trial_targeting_is_individual_and_drives_normal_attacks -- --exact
      - name: Compile production Enbu WASM from the same revision
        run: bash scripts/wasm/build.sh
      - name: Build 8 historical and 20 experimental Enbu WASM variants
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_LINKER="$(command -v wasm-ld)"
          # Production build.sh is deliberately optimized; keep its immutable
          # provenance separately. 000 must remain the actual Reference binary,
          # not the newly promoted production feature set.
          cp apps/web/public/wasm/senkei_wasm.wasm target/simulation-lab/senkei_wasm_production.wasm
          cargo build --locked --release --target wasm32-unknown-unknown -p senkei-wasm --lib
          cp target/wasm32-unknown-unknown/release/senkei_wasm.wasm target/simulation-lab/senkei_wasm_000.wasm
          for mask in 001 010 011 100 101 110 111; do
            value=$((2#$mask))
            features=()
            if (( value & 4 )); then features+=(lab-opt-termination); fi
            if (( value & 2 )); then features+=(lab-opt-cohort); fi
            if (( value & 1 )); then features+=(lab-opt-shields); fi
            feature_csv=$(IFS=,; echo "${features[*]}")
            echo "Build Enbu ${mask}: ${feature_csv}"
            cargo build --locked --release --target wasm32-unknown-unknown -p senkei-wasm --lib --features "${feature_csv}"
            cp target/wasm32-unknown-unknown/release/senkei_wasm.wasm "target/simulation-lab/senkei_wasm_${mask}.wasm"
            test -s "target/simulation-lab/senkei_wasm_${mask}.wasm"
          done
          # Real production Enbu algorithm candidates adapted from TS Lab:
          # indexed route planning and batched visibility, individually and together.
          for choice in R V RV TCSRV P A F FPA G TCSRVG O TCSRVGO I B TCSRVIB H TCSRVH S TCSRVS TCSRVHS W TCSRVGW X TCSRVGX TCSRVGAS; do
            case "$choice" in
              R) flags=lab-opt-route ;;
              V) flags=lab-opt-visibility ;;
              RV) flags=lab-opt-route,lab-opt-visibility ;;
              TCSRV) flags=lab-optimizations,lab-opt-route,lab-opt-visibility ;;
              P) flags=lab-opt-planned ;;
              A) flags=lab-opt-arithmetic ;;
              F) flags=lab-opt-frozen ;;
              FPA) flags=lab-opt-frozen,lab-opt-planned,lab-opt-arithmetic ;;
              G) flags=lab-opt-fog-cache ;;
              TCSRVG) flags=lab-optimizations,lab-opt-route,lab-opt-visibility,lab-opt-fog-cache ;;
              O) flags=lab-opt-observation ;;
              TCSRVGO) flags=lab-optimizations,lab-opt-route,lab-opt-visibility,lab-opt-fog-cache,lab-opt-observation ;;
              I) flags=lab-opt-inplace ;;
              B) flags=lab-opt-frontier ;;
              TCSRVIB) flags=lab-optimizations,lab-opt-route,lab-opt-visibility,lab-opt-inplace,lab-opt-frontier ;;
              H) flags=lab-opt-hybrid ;;
              TCSRVH) flags=lab-optimizations,lab-opt-route,lab-opt-visibility,lab-opt-hybrid ;;
              S) flags=lab-opt-scheduler ;;
              TCSRVS) flags=lab-optimizations,lab-opt-route,lab-opt-visibility,lab-opt-scheduler ;;
              TCSRVHS) flags=lab-optimizations,lab-opt-route,lab-opt-visibility,lab-opt-hybrid,lab-opt-scheduler ;;
              W) flags=lab-opt-movement-window ;;
              TCSRVGW) flags=lab-optimizations,lab-opt-route,lab-opt-visibility,lab-opt-fog-cache,lab-opt-movement-window ;;
              X) flags=lab-opt-spatial ;;
              TCSRVGX) flags=lab-optimizations,lab-opt-route,lab-opt-visibility,lab-opt-fog-cache,lab-opt-spatial ;;
              TCSRVGAS) flags=lab-optimizations,lab-opt-route,lab-opt-visibility,lab-opt-fog-cache,lab-opt-arithmetic,lab-opt-scheduler ;;
            esac
            cargo build --locked --release --target wasm32-unknown-unknown -p senkei-wasm --lib --features "$flags"
            cp target/wasm32-unknown-unknown/release/senkei_wasm.wasm "target/simulation-lab/senkei_wasm_${choice}.wasm"
            test -s "target/simulation-lab/senkei_wasm_${choice}.wasm"
          done
      - name: Verify promoted production WASM is exactly the tested TCSRVG build
        run: |
          cmp target/simulation-lab/senkei_wasm_production.wasm target/simulation-lab/senkei_wasm_TCSRVG.wasm
          # This verification-only binary must not enter the 33-variant
          # senkei_wasm_*.wasm publishing glob.
          rm target/simulation-lab/senkei_wasm_production.wasm
      - name: Stamp immutable fixture provenance
        env:
          REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          path = Path('target/simulation-lab/enbu-fixtures.json')
          data = json.loads(path.read_text())
          assert data['schema'] == 'senkei-enbu-wasm/v1'
          assert len(data['cases']) == 8
          for case in data['cases']:
              response = case.pop('native_response')
              case['response_sha256'] = hashlib.sha256(response.encode('utf-8')).hexdigest()
          data['revision'] = os.environ['REVISION']
          path.write_text(json.dumps(data, separators=(',', ':'), ensure_ascii=False))
          PY
      - name: Stamp all thirty-three immutable WASM hashes and sizes
        env:
          REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          variants=[]
          for i in range(8):
              mask=f'{i:03b}'
              file=Path(f'target/simulation-lab/senkei_wasm_{mask}.wasm')
              data=file.read_bytes()
              assert data[:4] == bytes.fromhex('0061736d') and len(data)>1000, file
              features=[]
              if i & 4: features.append('lab-opt-termination')
              if i & 2: features.append('lab-opt-cohort')
              if i & 1: features.append('lab-opt-shields')
              variants.append({
                  'id':mask,'features':features, 'wasm':f'wasm/senkei_wasm_{mask}.wasm',
                  'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),
              })
          extra={
              'R':['lab-opt-route'],
              'V':['lab-opt-visibility'],
              'RV':['lab-opt-route','lab-opt-visibility'],
              'TCSRV':['lab-optimizations','lab-opt-route','lab-opt-visibility'],
              'P':['lab-opt-planned'],
              'A':['lab-opt-arithmetic'],
              'F':['lab-opt-frozen'],
              'FPA':['lab-opt-frozen','lab-opt-planned','lab-opt-arithmetic'],
              'G':['lab-opt-fog-cache'],
              'TCSRVG':['lab-optimizations','lab-opt-route','lab-opt-visibility','lab-opt-fog-cache'],
              'O':['lab-opt-observation'],
              'TCSRVGO':['lab-optimizations','lab-opt-route','lab-opt-visibility','lab-opt-fog-cache','lab-opt-observation'],
              'I':['lab-opt-inplace'],
              'B':['lab-opt-frontier'],
              'TCSRVIB':['lab-optimizations','lab-opt-route','lab-opt-visibility','lab-opt-inplace','lab-opt-frontier'],
              'H':['lab-opt-hybrid'],
              'TCSRVH':['lab-optimizations','lab-opt-route','lab-opt-visibility','lab-opt-hybrid'],
              'S':['lab-opt-scheduler'],
              'TCSRVS':['lab-optimizations','lab-opt-route','lab-opt-visibility','lab-opt-scheduler'],
              'TCSRVHS':['lab-optimizations','lab-opt-route','lab-opt-visibility','lab-opt-hybrid','lab-opt-scheduler'],
              'W':['lab-opt-movement-window'],
              'TCSRVGW':['lab-optimizations','lab-opt-route','lab-opt-visibility','lab-opt-fog-cache','lab-opt-movement-window'],
              'X':['lab-opt-spatial'],
              'TCSRVGX':['lab-optimizations','lab-opt-route','lab-opt-visibility','lab-opt-fog-cache','lab-opt-spatial'],
              'TCSRVGAS':['lab-optimizations','lab-opt-route','lab-opt-visibility','lab-opt-fog-cache','lab-opt-arithmetic','lab-opt-scheduler']
          }
          for mask, features in extra.items():
              file=Path(f'target/simulation-lab/senkei_wasm_{mask}.wasm')
              data=file.read_bytes()
              assert data[:4] == bytes.fromhex('0061736d') and len(data)>1000, file
              variants.append({'id':mask,'features':features,
                  'wasm':f'wasm/senkei_wasm_{mask}.wasm',
                  'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          manifest={'schema':'senkei-enbu-matrix/v1','revision':os.environ['REVISION'],
                    'variants':variants}
          Path('target/simulation-lab/enbu-variants.json').write_text(
              json.dumps(manifest, separators=(',',':'),ensure_ascii=False))
          PY
      - name: Assemble static GitHub Pages site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/simulation-lab
          cp apps/simulation-lab/{index.html,styles.css,app.mjs,worker.mjs,core.mjs,timeline.mjs,inspector-ui.mjs,inspector-worker.mjs,enbu-ui.mjs,enbu-worker.mjs,enbu-wasm-abi.mjs,enbu-matrix-stats.mjs} _site/simulation-lab/
          mkdir -p _site/simulation-lab/wasm
          cp target/simulation-lab/senkei_wasm_*.wasm _site/simulation-lab/wasm/
          cp target/simulation-lab/{enbu-fixtures.json,enbu-variants.json} _site/simulation-lab/
          printf '{"revision":"%s","published_utc":"%s","engine":"synthetic-js+production-enbu-wasm"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > _site/simulation-lab/build.json
          test -s _site/simulation-lab/index.html
          test -s _site/simulation-lab/core.mjs
          test -s _site/simulation-lab/worker.mjs
          test -s _site/simulation-lab/timeline.mjs
          test -s _site/simulation-lab/inspector-worker.mjs
          test -s _site/simulation-lab/build.json
          test -s _site/simulation-lab/enbu-fixtures.json
          test -s _site/simulation-lab/enbu-variants.json
          test "$(find _site/simulation-lab/wasm -maxdepth 1 -name 'senkei_wasm_*.wasm' | wc -l)" -eq 33
          echo '<!doctype html><html lang="ja"><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=./simulation-lab/"><title>Senkei Simulation Lab</title><p><a href="./simulation-lab/">Simulation Lab</a></p></html>' > _site/index.html
          touch _site/.nojekyll
      - name: Gate publication on exact Native/WASM Enbu responses
        run: node apps/simulation-lab/enbu-conformance.mjs
      - name: Exercise published Simulation Lab Worker with real production WASM
        run: node apps/simulation-lab/enbu-publication-smoke.mjs
      - name: Install Chromium for real Simulation Lab acceptance
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Exercise published Lab UI in real Chromium against Enbu WASM
        run: node apps/simulation-lab/enbu-browser-smoke.mjs
      - name: Preserve browser Lab evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-lab-real-browser-evidence
          path: target/simulation-lab/browser-evidence/
          if-no-files-found: ignore
      - name: Retain validated release site
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: simulation-lab-validated-site
          path: _site
          retention-days: 2

  publish:
    name: Publish validated Simulation Lab
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: simulation-lab-validated-site
          path: _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4