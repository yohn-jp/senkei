[package]
name = "senkei-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "senkei_wasm"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "senkei-wasm-dispatch"
path = "src/bin/dispatch.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_ignored.workspace = true
senkei-model = { path = "../senkei-model" }
senritsu = { path = "../senritsu" }
senkei-world = { path = "../senkei-world" }
jinrei = { path = "../jinrei" }
enbu = { path = "../enbu" }
senkei-editor-adapter = { path = "../senkei-editor-adapter" }

[features]
# Build a second WASM from the same Enbu source for controlled Lab experiments.
lab-opt-termination = ["enbu/lab-opt-termination"]
lab-opt-cohort = ["enbu/lab-opt-cohort"]
lab-opt-shields = ["enbu/lab-opt-shields"]
lab-opt-route = ["enbu/lab-opt-route"]
lab-opt-visibility = ["enbu/lab-opt-visibility"]
lab-opt-planned = ["enbu/lab-opt-planned"]
lab-opt-arithmetic = ["enbu/lab-opt-arithmetic"]
lab-opt-frozen = ["enbu/lab-opt-frozen"]
lab-opt-fog-cache = ["enbu/lab-opt-fog-cache"]
lab-opt-observation = ["enbu/lab-opt-observation"]
lab-opt-inplace = ["enbu/lab-opt-inplace"]
lab-opt-frontier = ["enbu/lab-opt-frontier"]
lab-opt-hybrid = ["enbu/lab-opt-hybrid"]
lab-opt-scheduler = ["enbu/lab-opt-scheduler"]
lab-opt-movement-window = ["enbu/lab-opt-movement-window"]
lab-optimizations = ["lab-opt-termination", "lab-opt-cohort", "lab-opt-shields"]
