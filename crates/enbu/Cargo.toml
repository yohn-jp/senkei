[package]
name = "enbu"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
senkei-model = { path = "../senkei-model" }
senkei-behavior = { path = "../senkei-behavior" }
senritsu = { path = "../senritsu" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
jinrei = { path = "../jinrei" }
senkei-world = { path = "../senkei-world" }

[features]
# Physical execution changes only. Off in production by default.
lab-opt-termination = []
lab-opt-cohort = []
lab-opt-shields = []
lab-opt-route = []
lab-opt-visibility = []
# Historical all-on feature remains an explicit alias, not a separate implementation.
lab-optimizations = ["lab-opt-termination", "lab-opt-cohort", "lab-opt-shields"]
