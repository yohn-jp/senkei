[package]
name = "enbu"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
senkei-model = { path = "../senkei-model" }
senkei-behavior = { path = "../senkei-behavior" }
senritsu = { path = "../senritsu" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
jinrei = { path = "../jinrei" }
senkei-world = { path = "../senkei-world" }

[features]
# Physical execution changes only. Off in production by default.
lab-opt-termination = []
lab-opt-cohort = []
lab-opt-shields = []
lab-opt-route = []
lab-opt-visibility = []
# First proof-scoped Hybrid strategy: snapshot-local Planned combat candidate index.
# Reference scan remains the default and is used for all unsupported scopes.
lab-opt-planned = []
lab-opt-arithmetic = []
# Reuse immutable phase snapshots and skip impossible Skill acquisition copies.
lab-opt-frozen = []
# Reuse graph sight-probe results only when the exact source and map dependency key is unchanged.
lab-opt-fog-cache = []
# Share the current-Tick visibility source set across observation collection / schema checks.
lab-opt-observation = []
# PR #71: no per-actor movement clone; authoritative snapshot semantics unchanged.
lab-opt-inplace = []
# PR #71: lazy frozen target visibility for movement and combat selection.
lab-opt-frontier = []
# Adaptive phase-scoped portfolio: no global Tick skipping, cost-gated P/A.
lab-opt-hybrid = ["lab-opt-planned", "lab-opt-arithmetic", "lab-opt-inplace", "lab-opt-frontier"]
# Historical all-on feature remains an explicit alias, not a separate implementation.
lab-optimizations = ["lab-opt-termination", "lab-opt-cohort", "lab-opt-shields"]
